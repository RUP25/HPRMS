# Render Blueprint: https://render.com/docs/blueprint-spec
# If a deploy fails: Dashboard → hprms → Events (or Logs) for the exact error.
# Typical fixes: native build for better-sqlite3 (pinned Node below), or set AUTH_SECRET manually if generateValue misbehaves.

services:
  - type: web
    name: hprms
    runtime: node
    plan: free
    branch: main
    region: oregon
    buildCommand: npm ci && npm ci --prefix client && npm run build:customer
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
