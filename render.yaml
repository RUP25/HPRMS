# Render Blueprint: https://render.com/docs/blueprint-spec
# After pushing, use Dashboard → New → Blueprint → connect repo, or attach this file to an existing Web Service.

services:
  - type: web
    name: hprms
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build:customer
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
