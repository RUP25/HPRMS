# Render Blueprint: https://render.com/docs/blueprint-spec
# If a deploy fails: Dashboard → hprms → Events (or Logs) for the exact error.
# Typical fixes: native build for better-sqlite3 (pinned Node below), or set AUTH_SECRET manually if generateValue misbehaves.
# Client devDependencies (Vite) are required at build time; NODE_ENV=production would otherwise omit them from `npm ci`.

services:
  - type: web
    name: hprms
    runtime: node
    plan: free
    branch: main
    region: oregon
    buildCommand: npm ci && npm ci --prefix client --include=dev && npm run build:customer
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
      # Operator console PINs (same defaults as .env.example — change in Dashboard for real use)
      - key: ADMIN_PIN
        value: "2468"
      - key: KITCHEN_PIN
        value: "1111"
      - key: BAR_PIN
        value: "2222"
      # Omit BILLING_PIN so /billing uses ADMIN_PIN (one demo PIN). Set BILLING_PIN in Dashboard for a separate cashier PIN.
