<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Dopwai - the restaurant at Hotel Poinisuk">
  <defs>
    <linearGradient id="dopl-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fbf3df"/>
      <stop offset="100%" stop-color="#e6d6a9"/>
    </linearGradient>
    <linearGradient id="dopl-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f1d488"/>
      <stop offset="50%"  stop-color="#c9a45f"/>
      <stop offset="100%" stop-color="#7a5b1f"/>
    </linearGradient>
  </defs>

  <text x="360" y="32" text-anchor="middle"
        font-family="'Cinzel','Cormorant Garamond','Times New Roman',Georgia,serif"
        font-weight="600" font-size="14" letter-spacing="9"
        fill="url(#dopl-gold)">HOTEL  POINISUK</text>

  <line x1="200" y1="50" x2="520" y2="50" stroke="url(#dopl-gold)" stroke-width="0.8"/>

  <text x="360" y="170" text-anchor="middle"
        font-family="'Playfair Display','Cormorant Garamond','Times New Roman',Georgia,serif"
        font-style="italic" font-weight="700" font-size="148" letter-spacing="-2"
        fill="url(#dopl-cream)">Dopwai</text>

  <!-- Areca leaf ornament: long pinnate leaf with central rib + leaflets -->
  <g transform="translate(360 200)" opacity="0.9">
    <line x1="-90" y1="0" x2="-22" y2="0" stroke="url(#dopl-gold)" stroke-width="0.9"/>
    <line x1="22"  y1="0" x2="90"  y2="0" stroke="url(#dopl-gold)" stroke-width="0.9"/>
    <g stroke="url(#dopl-gold)" stroke-width="1" fill="none" stroke-linecap="round">
      <path d="M -18 0 Q 0 -2 18 0"/>
      <path d="M -14 -2 L -10 -7"/>
      <path d="M -7  -2 L -4  -8"/>
      <path d="M  0  -2 L  0  -9"/>
      <path d="M  7  -2 L  4  -8"/>
      <path d="M 14  -2 L 10  -7"/>
      <path d="M -14  2 L -10  7"/>
      <path d="M -7   2 L -4   8"/>
      <path d="M  0   2 L  0   9"/>
      <path d="M  7   2 L  4   8"/>
      <path d="M 14   2 L 10   7"/>
    </g>
  </g>

  <text x="360" y="244" text-anchor="middle"
        font-family="'Cinzel','Cormorant Garamond','Times New Roman',Georgia,serif"
        font-weight="500" font-size="14" letter-spacing="11"
        fill="url(#dopl-gold)">RESTAURANT</text>
</svg>
