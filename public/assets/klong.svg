<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Klong Lounge Bar at Hotel Poinisuk">
  <defs>
    <linearGradient id="klong-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f1d488"/>
      <stop offset="50%"  stop-color="#c9a45f"/>
      <stop offset="100%" stop-color="#7a5b1f"/>
    </linearGradient>
    <linearGradient id="klong-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6efff"/>
      <stop offset="100%" stop-color="#d0bfe5"/>
    </linearGradient>
  </defs>

  <text x="360" y="32" text-anchor="middle"
        font-family="'Cinzel','Cormorant Garamond','Times New Roman',Georgia,serif"
        font-weight="600" font-size="14" letter-spacing="9"
        fill="url(#klong-gold)">HOTEL  POINISUK</text>

  <g transform="translate(360 60)">
    <line x1="-200" y1="0" x2="-44" y2="0" stroke="url(#klong-gold)" stroke-width="1"/>
    <line x1="44"   y1="0" x2="200" y2="0" stroke="url(#klong-gold)" stroke-width="1"/>
    <g transform="translate(0 0)" stroke="url(#klong-gold)" fill="none" stroke-width="1.2">
      <path d="M -22 -10 L 22 -10 L 0 14 Z"/>
      <line x1="0" y1="14" x2="0" y2="22"/>
      <line x1="-9" y1="22" x2="9" y2="22"/>
      <circle cx="-13" cy="-7" r="2.2" fill="url(#klong-gold)"/>
    </g>
  </g>

  <text x="360" y="180" text-anchor="middle"
        font-family="'Cinzel','Playfair Display','Times New Roman',Georgia,serif"
        font-weight="700" font-size="142" letter-spacing="14"
        fill="url(#klong-ink)" stroke="url(#klong-gold)" stroke-width="1.2">KLONG</text>

  <g transform="translate(360 210)">
    <line x1="-90" y1="0" x2="-12" y2="0" stroke="url(#klong-gold)" stroke-width="0.9"/>
    <line x1="12"  y1="0" x2="90"  y2="0" stroke="url(#klong-gold)" stroke-width="0.9"/>
    <path d="M 0 -5 L 4 0 L 0 5 L -4 0 Z" fill="url(#klong-gold)"/>
  </g>

  <text x="360" y="248" text-anchor="middle"
        font-family="'Cinzel','Cormorant Garamond','Times New Roman',Georgia,serif"
        font-weight="500" font-size="14" letter-spacing="13"
        fill="url(#klong-gold)">LOUNGE  BAR</text>
</svg>
